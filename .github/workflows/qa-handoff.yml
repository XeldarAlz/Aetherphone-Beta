# Hands a beta build to the testers: the version's Drive folder and sheets, new test items at the
# bottom of the testing sheet, and the version's post in the staff server's beta forum. Runs after
# every beta from beta-release.yml, or by hand to retry a build or check the connections. The logs of
# this repository are public, so every Discord and Drive value is a secret and the script redacts ids.

name: Tester handoff

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ping:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta tag to hand off (beta-v1.3.1.3); leave empty for check'
        required: false
        type: string
      mode:
        description: 'run, dry-run (no writes), refresh (redraw the post, add nothing) or check (connections only)'
        required: true
        type: choice
        options:
          - run
          - dry-run
          - refresh
          - check
        default: run
      ping:
        description: 'Ping the testers'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-handoff
  cancel-in-progress: false

jobs:
  handoff:
    name: Hand the build to testers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPOSITORY: XeldarAlz/FFXIV-Aetherphone
      BUILD_TAG: ${{ inputs.tag }}
      QA_MODE: ${{ inputs.mode || 'run' }}
      QA_PING: ${{ inputs.ping }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_BETA_FORUM_ID: ${{ secrets.DISCORD_BETA_FORUM_ID }}
      DISCORD_TESTER_ROLE_ID: ${{ secrets.DISCORD_TESTER_ROLE_ID }}
      QA_DRIVE_URL: ${{ secrets.QA_DRIVE_URL }}
      QA_DRIVE_SECRET: ${{ secrets.QA_DRIVE_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      # main, not the triggering commit: the release job has just pushed this build's record to builds.json.
      - name: Checkout the beta repository
        uses: actions/checkout@v7
        with:
          ref: main
          path: beta
          persist-credentials: false

      - name: Check the connections
        if: env.QA_MODE == 'check'
        run: node beta/.github/scripts/qa-handoff.mjs check

      - name: Find the build
        id: build
        if: env.QA_MODE != 'check'
        run: node beta/.github/scripts/qa-handoff.mjs resolve

      - name: Checkout the plugin source
        if: env.QA_MODE != 'check'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.build.outputs.sha }}
          path: plugin
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the folder and the changelog
        if: env.QA_MODE != 'check'
        run: node beta/.github/scripts/qa-handoff.mjs prepare

      - name: Install Claude Code
        if: (env.QA_MODE == 'run' || env.QA_MODE == 'dry-run') && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install --global @anthropic-ai/claude-code@2.1.301

      # Claude only writes a JSON file; when it fails or is not configured, publish falls back to
      # one test item per new changelog bullet, so this step can never block the handoff.
      - name: Write the test items
        if: (env.QA_MODE == 'run' || env.QA_MODE == 'dry-run') && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        continue-on-error: true
        timeout-minutes: 25
        working-directory: plugin
        run: >
          claude -p
          --model claude-opus-5-5
          --max-turns 150
          --output-format json
          --json-schema "$(cat ../qa/schema.json)"
          --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
          < ../qa/prompt.md > ../qa/claude.json

      - name: Publish to Drive and Discord
        if: env.QA_MODE != 'check'
        run: node beta/.github/scripts/qa-handoff.mjs publish
