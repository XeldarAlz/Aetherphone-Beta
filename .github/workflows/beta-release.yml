name: Release Aetherphone Beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit of FFXIV-Aetherphone to build'
        required: false
        default: 'dev'
        type: string
      ping:
        description: 'Ping the testers in the beta forum'
        required: false
        default: true
        type: boolean
      allow_same_commit:
        description: 'Build even when the plugin commit is the one the last beta was built from'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    env:
      SOURCE_REPOSITORY: XeldarAlz/FFXIV-Aetherphone
      SOURCE_REF: ${{ inputs.ref || 'dev' }}

    steps:
      - name: Checkout the beta repository
        uses: actions/checkout@v7
        with:
          path: beta
          fetch-depth: 0
          # A PAT keeps working if main ever becomes a protected branch; the
          # built-in token is enough while it is not.
          token: ${{ secrets.HUB_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout the plugin source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: plugin
          # Full history so the compare range in the notes and the +sha in
          # InformationalVersion both resolve.
          fetch-depth: 0

      - name: Resolve the beta version
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The newest changelog entry is the release the beta previews.
          $changelogData = 'plugin/src/Aetherphone/Core/Changelog/ChangelogData.cs'
          if (-not (Test-Path $changelogData)) {
            throw "No changelog at $changelogData"
          }
          $newest = [regex]::Match((Get-Content -Raw $changelogData), 'new ChangelogEntry\(\s*"([0-9]+(?:\.[0-9]+){2,3})"')
          if (-not $newest.Success) {
            throw 'Could not read the newest changelog entry.'
          }
          $changelogVersion = $newest.Groups[1].Value
          $previewed = [version]$changelogVersion

          $shipped = git ls-remote --tags "https://github.com/$env:SOURCE_REPOSITORY.git" "refs/tags/v$changelogVersion"
          if (-not [string]::IsNullOrWhiteSpace($shipped)) {
            throw "$changelogVersion already shipped as v$changelogVersion. Open the next changelog entry on dev before cutting a beta."
          }

          $buildNumber = 1
          if (Test-Path 'beta/builds.json') {
            foreach ($record in @(Get-Content -Raw 'beta/builds.json' | ConvertFrom-Json)) {
              if ($record.ChangelogVersion -eq $changelogVersion -and [int]$record.Build -ge $buildNumber) {
                $buildNumber = [int]$record.Build + 1
              }
            }
          }
          if ($buildNumber -gt 99) {
            throw "$changelogVersion already has 99 betas; the revision only holds two digits of beta number."
          }

          # Dalamud only offers an update when the version goes up, so the beta number rides in the
          # revision: 1.3.1.0 beta 3 is 1.3.1.3, and 1.3.0.1 beta 2 is 1.3.0.102.
          $revision = [Math]::Max($previewed.Revision, 0) * 100 + $buildNumber
          $version = "$($previewed.Major).$($previewed.Minor).$($previewed.Build).$revision"
          $published = @(Get-Content -Raw 'beta/repo.json' | ConvertFrom-Json)[0].AssemblyVersion
          if ([version]$version -le [version]$published) {
            throw "Beta $version is not newer than the published $published, so installed betas would never update."
          }

          $sha = (git -C plugin rev-parse HEAD).Trim()
          $shortSha = (git -C plugin rev-parse --short HEAD).Trim()

          $previousSha = ''
          if (Test-Path 'beta/beta-state.json') {
            $previousSha = (Get-Content -Raw 'beta/beta-state.json' | ConvertFrom-Json).Sha
          }

          if ($previousSha -eq $sha -and '${{ inputs.allow_same_commit }}' -ne 'true') {
            throw "The last beta was already built from $shortSha, so this one would ship the same plugin again. Push a change to $env:SOURCE_REF first, or run with allow_same_commit."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog_version=$changelogVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "build_number=$buildNumber"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=beta-v$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$sha"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "short_sha=$shortSha"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "previous_sha=$previousSha"
          Write-Host "Building beta $buildNumber of $changelogVersion as $version from $env:SOURCE_REF ($shortSha)"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudUrl = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri $dalamudUrl -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - name: Restore (locked)
        run: dotnet restore plugin/Aetherphone.sln --locked-mode

      - name: Build (Release, beta channel)
        run: >
          dotnet build plugin/Aetherphone.sln --configuration Release --no-restore
          -p:AetherphoneBeta=true
          -p:Version=${{ steps.build.outputs.version }}

      - name: Stage latest.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'plugin/src/Aetherphone/bin/Release/AetherphoneBeta/latest.zip'
          if (-not (Test-Path $src)) { throw "Beta plugin zip not found at $src" }

          $manifest = Get-Content -Raw 'plugin/src/Aetherphone/bin/Release/AetherphoneBeta/AetherphoneBeta.json' | ConvertFrom-Json
          if ($manifest.InternalName -ne 'AetherphoneBeta') {
            throw "Built manifest carries InternalName '$($manifest.InternalName)'; the beta channel must stay side by side with the stable plugin."
          }
          if ($manifest.AssemblyVersion -ne '${{ steps.build.outputs.version }}') {
            throw "Built manifest is ${{ steps.build.outputs.version }} in name only: AssemblyVersion is $($manifest.AssemblyVersion)."
          }

          Copy-Item $src 'latest.zip' -Force

      - name: Write the release notes
        id: notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceUrl = "https://github.com/$env:SOURCE_REPOSITORY"
          $commitUrl = "$sourceUrl/commit/${{ steps.build.outputs.sha }}"
          $previous = '${{ steps.build.outputs.previous_sha }}'

          $subjects = @()
          $compareUrl = ''
          if (-not [string]::IsNullOrWhiteSpace($previous)) {
            $compareUrl = "$sourceUrl/compare/$previous...${{ steps.build.outputs.sha }}"
            $log = git -C plugin log --no-merges --pretty=format:'%s' "$previous..${{ steps.build.outputs.sha }}"
            if (-not [string]::IsNullOrWhiteSpace($log)) {
              $subjects = @($log -split "`n" | Where-Object { $_.Trim().Length -gt 0 })
            }
          }

          $lines = @(
            "Beta ${{ steps.build.outputs.build_number }} of ${{ steps.build.outputs.changelog_version }}, built from ``$env:SOURCE_REF`` at [``${{ steps.build.outputs.short_sha }}``]($commitUrl)."
            ''
            'This is a preview build. It installs next to the stable plugin, keeps its own settings and opens with `/phonebeta`.'
          )
          if (-not [string]::IsNullOrWhiteSpace($compareUrl)) {
            $lines += ''
            $lines += "[What changed since the last beta]($compareUrl)"
            if ($subjects.Count -gt 0) {
              $lines += ''
              $lines += ($subjects | ForEach-Object { "- $_" })
            }
          }

          $body = ($lines -join "`n")
          if ($body.Length -gt 60000) { $body = $body.Substring(0, 60000) }
          Set-Content -Path 'release-notes.md' -Value $body -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "compare_url=$compareUrl"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "change_count=$($subjects.Count)"

      - name: Create the beta release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Beta ${{ steps.build.outputs.changelog_version }} build ${{ steps.build.outputs.build_number }} (${{ steps.build.outputs.version }})
          body_path: release-notes.md
          files: latest.zip
          prerelease: true
          fail_on_unmatched_files: true

      - name: Fetch total download count
        id: count
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[].assets[].download_count] | add // 0')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Total beta downloads across all releases: $total"

      - name: Publish the manifest
        shell: pwsh
        working-directory: beta
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.build.outputs.version }}'
          $json = Get-Content -Raw -Path 'repo.json' | ConvertFrom-Json
          $json[0].AssemblyVersion = $version
          $json[0].TestingAssemblyVersion = $version
          $json[0].DownloadCount = [int]'${{ steps.count.outputs.total }}'
          $json[0] | Add-Member -NotePropertyName 'LastUpdate' -NotePropertyValue ([string][int][double]::Parse((Get-Date -UFormat %s))) -Force

          # Every release here is a prerelease, and /releases/latest/ skips
          # prereleases, so that URL 404s. Point at the tag this run just made.
          $download = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/${{ steps.build.outputs.tag }}/latest.zip"
          $json[0].DownloadLinkInstall = $download
          $json[0].DownloadLinkUpdate = $download
          $json[0].DownloadLinkTesting = $download
          # -AsArray preserves the array wrapper Dalamud requires; piping a
          # single-element array unrolls it and loses the brackets.
          ConvertTo-Json -InputObject $json -Depth 10 -AsArray | Set-Content -Path 'repo.json' -Encoding utf8

          $state = [ordered]@{
            SourceRepository = $env:SOURCE_REPOSITORY
            Ref              = $env:SOURCE_REF
            Sha              = '${{ steps.build.outputs.sha }}'
            Version          = $version
            Tag              = '${{ steps.build.outputs.tag }}'
            BuiltAt          = (Get-Date).ToUniversalTime().ToString('o')
          }
          ConvertTo-Json -InputObject $state -Depth 5 | Set-Content -Path 'beta-state.json' -Encoding utf8

          $builds = @()
          if (Test-Path 'builds.json') {
            $builds = @(Get-Content -Raw 'builds.json' | ConvertFrom-Json)
          }
          $builds += [pscustomobject][ordered]@{
            Version          = $version
            ChangelogVersion = '${{ steps.build.outputs.changelog_version }}'
            Build            = [int]'${{ steps.build.outputs.build_number }}'
            Sha              = '${{ steps.build.outputs.sha }}'
            Tag              = '${{ steps.build.outputs.tag }}'
            BuiltAt          = $state.BuiltAt
          }
          ConvertTo-Json -InputObject $builds -Depth 5 | Set-Content -Path 'builds.json' -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add repo.json beta-state.json builds.json
          if (-not (git status --porcelain)) {
            Write-Host 'Nothing to commit.'
            exit 0
          }

          git commit -m "Beta $version from ${{ steps.build.outputs.short_sha }}"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git fetch origin main
            git rebase -X theirs origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              Write-Host "Rebase failed (attempt $attempt); retrying..."
              Start-Sleep -Seconds 2
              continue
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Push rejected (attempt $attempt); retrying after rebase..."
            Start-Sleep -Seconds 2
          }
          Write-Error 'Failed to push the beta manifest after 5 attempts.'
          exit 1

  handoff:
    name: Tester handoff
    needs: release
    uses: ./.github/workflows/qa-handoff.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      ping: ${{ inputs.ping }}
    secrets: inherit
